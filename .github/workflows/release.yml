name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    env:
      # Developer ID signing and notarization run only when these secrets
      # exist; without them the build is unsigned, as before.
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Signing keychain (Developer ID)
        if: env.MACOS_CERT_P12 != '' && env.MACOS_SIGN_IDENTITY != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "APPLE_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            xcrun notarytool store-credentials promptly --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$KC"
            echo "NOTARY_PROFILE=promptly" >> "$GITHUB_ENV"
          else
            echo "::notice::Signing with Developer ID; notarization skipped (APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD not set)."
          fi
      - name: Unsigned build notice
        if: env.MACOS_CERT_P12 == '' || env.MACOS_SIGN_IDENTITY == ''
        run: echo "::notice::No Developer ID secrets; building an unsigned Promptly.app."
      - name: Build Promptly.app (Apple silicon)
        run: ./scripts/bundle-macos.sh
      - name: Verify signature
        if: env.APPLE_SIGN_IDENTITY != ''
        run: |
          codesign --verify --deep --strict --verbose=2 target/release/Promptly.app
          if [ -n "${NOTARY_PROFILE:-}" ]; then
            xcrun stapler validate target/release/Promptly.app
            spctl --assess --type execute --verbose target/release/Promptly.app
          fi
      - name: Zip
        run: |
          cd target/release
          ditto -c -k --keepParent Promptly.app "Promptly-${GITHUB_REF_NAME}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/Promptly-*-macos-arm64.zip

  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev libgtk-3-dev
      - name: Build
        run: cargo build --release --workspace
      - name: Package tarball and .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p promptly --no-build
          mkdir -p dist
          cp target/debian/*.deb dist/
          tar -C target/release -czf "dist/promptly-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}.tar.gz" promptly promptly-ctl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums (verified by the in-app updater)
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Promptly ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
