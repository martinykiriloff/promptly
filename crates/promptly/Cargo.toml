[package]
name = "promptly"
version = "2026.3.0"
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["image-data"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "wayland", "x11"] }
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify-rust = "4.18.1"
parking_lot = "0.12.5"
polling = { version = "3", default-features = false }
promptly-core = { version = "2026.3.0", path = "../promptly-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Linux packages: `cargo deb -p promptly` and `cargo generate-rpm -p crates/promptly`.
[package.metadata.deb]
name = "promptly"
maintainer = "Promptly <hello@promptly.invalid>"
section = "utils"
assets = [
  ["target/release/promptly", "usr/bin/", "755"],
  ["target/release/promptly-ctl", "usr/bin/", "755"],
  ["../../packaging/promptly.desktop", "usr/share/applications/", "644"],
  ["../../packaging/icon/promptly-512.png", "usr/share/icons/hicolor/512x512/apps/promptly.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/promptly", dest = "/usr/bin/promptly", mode = "755" },
  { source = "target/release/promptly-ctl", dest = "/usr/bin/promptly-ctl", mode = "755" },
  { source = "packaging/promptly.desktop", dest = "/usr/share/applications/promptly.desktop", mode = "644" },
  { source = "packaging/icon/promptly-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/promptly.png", mode = "644" },
]
